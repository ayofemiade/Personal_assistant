<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moyo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F2A93B'/%3E%3Ctext x='16' y='22.5' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='18' fill='%231B1308'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span><span class="brand-name">Moyo</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-section">
      <div class="side-label">Workspaces</div>
      <div class="ws-list" id="wslist"></div>
      <div class="media" aria-label="Music controls" role="group" id="media"></div>
      <div class="clock" id="clock" aria-hidden="true"></div>
      <div class="mic-ind" id="mic-indicator" hidden title="Clap to wake is on: the mic is checked for loudness on this laptop only. Nothing is recorded."><span class="mic-dot" aria-hidden="true"></span><span class="label">Listening for claps</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="cmd">
        <form id="cmd" autocomplete="off" role="search">
          <label class="sr-only" for="cmdin">Ask Moyo</label>
          <span class="faint" aria-hidden="true" id="cmdicon"></span>
          <input id="cmdin" placeholder="Ask Moyo or give a command: “add task send proposal to Tunde tomorrow”" maxlength="2000">
          <span class="hint" aria-hidden="true"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
          <button class="btn btn-primary sm" type="submit">Send</button>
        </form>
        <div id="reply" class="reply hidden" role="status" aria-live="polite"></div>
      </div>
      <button class="btn btn-ghost icon talk-btn" id="talkbtn" aria-label="Talk to Moyo" title="Talk to Moyo (voice)"><span id="talkicon"></span></button>
      <div class="bell-wrap">
        <button class="btn btn-ghost icon" id="bell" aria-haspopup="dialog" aria-expanded="false" aria-controls="notifpanel" aria-label="Notifications">
          <span id="bellicon"></span><span class="badge hidden" id="badge"></span></button>
        <div class="notif-panel hidden" id="notifpanel" role="dialog" aria-label="Notifications"></div>
      </div>
    </header>
    <main class="page" id="main" tabindex="-1">
      <section id="view-today" class="view" aria-label="Today"></section>
      <section id="view-tasks" class="view" aria-label="Tasks"></section>
      <section id="view-money" class="view" aria-label="$10K challenge"></section>
      <section id="view-content" class="view" aria-label="Content"></section>
      <section id="view-review" class="view" aria-label="Review"></section>
      <section id="view-memory" class="view" aria-label="Memory"></section>
      <section id="view-settings" class="view" aria-label="Settings"></section>
    </main>
  </div>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
<script src="/static/revenue.js"></script>
<script src="/static/revenue-money.js"></script>
</body>
</html>
